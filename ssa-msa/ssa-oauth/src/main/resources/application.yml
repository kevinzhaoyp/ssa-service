server:
  port: 8081
  servlet:
    context-path: /
spring:
  application:
    name: oauth
  config:
    import: "optional:nacos:${spring.application.name}.yaml"
  cloud:
    nacos:
      server-addr: 113.44.117.125:8800  # Nacos 服务器地址
      username: nacos
      password: yds@2019
      discovery:
        namespace: gateway2               # 命名空间
        group: DEFAULT_GROUP              # 分组
      config:
        file-extension: yaml              # 配置文件格式
        namespace: gateway2               # 命名空间
        group: DEFAULT_GROUP              # 分组
        extension-configs:
          - data-id: common.yaml
            group: PUBLIC
            refresh: true
          - data-id: redis-auth.yaml
            group: PUBLIC
            refresh: true
# JWT配置
jwt:
  secret: ${JWT_SECRET:mySecretKeyForSSAOAuth}
  access-token-expiration: 7200  # 2小时
  refresh-token-expiration: 604800 # 7天

# 自定义配置
oauth:
  jwt:
    issuer: https://ssa-oauth.example.com
    audience: ssa-app-users

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,jwt,jwks
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      simple:
        enabled: true

logging:
  level:
    com.ssa.oauth: DEBUG
    org.springframework.security: DEBUG
    com.alibaba.nacos: INFO

# ssa 插件配置（加载 sql-api 插件）
ssa:
  plugin:
    pluginPath: D:/work/SSAuditor/SSA-OPC/Dev/ssa-service/plugins/
    plugins:
      - key: sql-api
        fileName: sql-api-2.0.0.jar
        state: enable
        type: jar
  oauth:
    sqlapi:
      user-by-identifier: user.login
      user-by-id: user.getUserInfo
      user-permissions: user.permissions
      user-roles: user.roles
    client-cache-ttl-seconds: 300


sqlapi:
  datasource:
    main:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://113.44.117.125:9920/ssa
      username: root
      password: ysj@2019
      max-active: 200
  template:
    cache: 0
    path:
      - D:\work\SSAuditor\SSA-OPC\Dev\ssa-eas-vue\sql\ymlapi
